{% extends 'comercial/base.html' %}

{% block contenido %}

<h2>{{ titulo }}</h2>

{% if mensaje %}
    <div class="empty-state">
        <strong>Validación del sistema</strong>
        <p>{{ mensaje }}</p>
    </div>
{% endif %}

{% if ayuda %}
    <div class="aviso-informativo">
        <strong>Importante</strong>
        <p>{{ ayuda }}</p>
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ formulario.as_p }}

    <button type="submit">Guardar</button>
</form>

<br>

<a href="{% url 'inicio' %}" class="boton">Volver al inicio</a>

{% endblock %}
